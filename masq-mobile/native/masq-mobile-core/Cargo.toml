[package]
name = "masq-mobile-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Fail-closed mobile consume-only adapter for MASQ Node"
workspace = "../../../masq-node-mobile/node"

[lib]
name = "masq_mobile_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# The default build is deliberately unavailable rather than silently sending traffic directly.
node-engine = ["dep:node_lib"]

[dependencies]
jni = "=0.21.1"
libsecp256k1 = "=0.7.0"
once_cell = "=1.18.0"
serde = { version = "=1.0.136", features = ["derive"] }
serde_json = "=1.0.79"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
tiny-bip39 = "=0.8.2"
tiny-hderive = "=0.3.0"
zeroize = "=1.4.3"
node_lib = { package = "node", path = "../../../masq-node-mobile/node", optional = true }
