[workspace]

[package]
name = "masq-packet-tunnel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Fail-closed Android TUN to local MASQ HTTP proxy adapter"

[lib]
name = "masq_packet_tunnel"
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "=1.21.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
tun2proxy = { version = "=0.8.3", default-features = false }
