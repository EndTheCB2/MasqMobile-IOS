[package]
edition = "2024"
name = "ipstack"
version = "1.0.1"
authors = ["Narrowlink <opensource@narrowlink.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Asynchronous lightweight userspace implementation of TCP/IP stack for Tun device"
homepage = "https://narrowlink.com"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/narrowlink/ipstack"

[lib]
name = "ipstack"
path = "src/lib.rs"
doctest = false

[dependencies.ahash]
version = "0.8"
features = ["std"]
default-features = false

[dependencies.etherparse]
version = "0.20"
features = ["std"]
default-features = false

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.rand]
version = "0.10"
features = ["thread_rng"]
default-features = false

[dependencies.thiserror]
version = "2.0"
default-features = false

[dependencies.tokio]
version = "1.52"
features = [
    "sync",
    "rt",
    "time",
    "io-util",
    "macros",
    "rt-multi-thread",
]
default-features = false

[build-dependencies.serde_json]
version = "1"

[profile.bench]
opt-level = 3
lto = false
codegen-units = 16
debug = 2
incremental = true
strip = "none"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
debug-assertions = false
rpath = false
panic = "abort"
overflow-checks = false
incremental = false
strip = true
