name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**
      - codex/**

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: UI, core, engine, and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: masq-mobile/package-lock.json
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup toolchain install 1.97.1 --profile minimal
      - name: Install JavaScript dependencies
        working-directory: masq-mobile
        run: npm ci
      - name: Type-check
        working-directory: masq-mobile
        timeout-minutes: 5
        run: npm run typecheck
      - name: Lint
        working-directory: masq-mobile
        timeout-minutes: 5
        run: npm run lint
      - name: Test UI and shared TypeScript
        working-directory: masq-mobile
        timeout-minutes: 10
        run: npm run test:ci:linux
      - name: Fetch locked Rust dependencies
        timeout-minutes: 15
        run: |
          rustup run 1.77.2 cargo fetch --locked --manifest-path masq-mobile/native/masq-mobile-core/Cargo.toml
          rustup run 1.97.1 cargo fetch --locked --manifest-path masq-mobile/native/masq-packet-tunnel/Cargo.toml
      - name: Test mobile core
        working-directory: masq-mobile
        timeout-minutes: 30
        run: npm run test:core
      - name: Test embedded node engine
        working-directory: masq-mobile
        timeout-minutes: 45
        run: npm run test:engine
      - name: Test packet tunnel
        working-directory: masq-mobile
        timeout-minutes: 15
        run: npm run test:tunnel
      - name: Verify source privacy
        working-directory: masq-mobile
        timeout-minutes: 5
        run: npm run verify:privacy

  ios:
    name: Unsigned iPhone release build
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: masq-mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.1.6
          bundler: 2.4.22
          bundler-cache: true
          working-directory: masq-mobile
      - name: Install Rust and JavaScript dependencies
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup target add --toolchain 1.77.2 aarch64-apple-ios
          cd masq-mobile
          npm ci
      - name: Verify iOS source integration
        working-directory: masq-mobile
        run: npm run test:ci:ios
      - name: Install locked CocoaPods
        working-directory: masq-mobile/ios
        run: bundle _2.4.22_ exec pod install --deployment
      - name: Build the complete embedded MASQ core for iPhone
        working-directory: masq-mobile
        run: >-
          xcodebuild
          -workspace ios/MasqMobile.xcworkspace
          -scheme MasqMobile
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          MASQ_NODE_FINDER_URL=https://ci.invalid.example
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

  android:
    name: Unsigned Android release
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: masq-mobile/package-lock.json
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK and pinned Rust tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          rustup toolchain install 1.77.2 --profile minimal
          rustup target add --toolchain 1.77.2 aarch64-linux-android x86_64-linux-android
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-linux-android x86_64-linux-android
          rustup run 1.97.1 cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install JavaScript dependencies
        working-directory: masq-mobile
        run: npm ci
      - name: Build self-contained unsigned APK
        working-directory: masq-mobile/android
        env:
          MASQ_NODE_FINDER_URL: https://ci.invalid.example
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify Android native linkage in the assembled APK
        working-directory: masq-mobile
        run: >-
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.1.12297006"
          npm run verify:android:native:apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masq-mobile-unsigned-android
          path: masq-mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
