version: 2
updates:
  - package-ecosystem: npm
    directory: /masq-mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /masq-mobile/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /masq-mobile/native/masq-packet-tunnel
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
